<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Social preview source. Export to public/og-image.png (1200×630) — see README.
    Colors mirror src/styles/theme.ts: paper #F4F1EA, surface #FFFFFF, ink #111111,
    muted #5A5A5A, accent #31C7B1, project accents #F7AE85 #998BBF #4D7CFE #2BB673.
  -->
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@500;700&amp;family=Space+Grotesk:wght@700&amp;display=swap");
      .heading { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; }
      .body { font-family: Inter, system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-weight: 500; letter-spacing: 0.06em; }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#111111" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Grid paper -->
  <rect width="1200" height="630" fill="#F4F1EA" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Card with hard shadow -->
  <rect x="68" y="68" width="1076" height="506" fill="#111111" />
  <rect x="56" y="56" width="1076" height="506" fill="#FFFFFF" stroke="#111111" stroke-width="6" />

  <!-- Terminal title bar -->
  <rect x="56" y="56" width="1076" height="52" fill="#31C7B1" stroke="#111111" stroke-width="6" />
  <rect x="82" y="74" width="16" height="16" fill="#FFFFFF" stroke="#111111" stroke-width="3" />
  <rect x="108" y="74" width="16" height="16" fill="#FFFFFF" stroke="#111111" stroke-width="3" />
  <rect x="134" y="74" width="16" height="16" fill="#FFFFFF" stroke="#111111" stroke-width="3" />
  <text x="172" y="89" class="mono" font-size="18" fill="#111111">elhassanefek-portfolio.vercel.app</text>

  <!-- Section-style label -->
  <rect x="100" y="150" width="60" height="34" fill="#31C7B1" stroke="#111111" stroke-width="3" />
  <text x="130" y="173" class="mono" font-size="18" fill="#111111" text-anchor="middle">01</text>
  <text x="178" y="173" class="mono" font-size="18" fill="#5A5A5A">/</text>
  <text x="200" y="173" class="mono" font-size="18" fill="#111111">SOFTWARE ENGINEER</text>

  <!-- Name -->
  <text x="98" y="290" class="heading" font-size="96" fill="#111111">FEKAIRI</text>
  <text x="98" y="384" class="heading" font-size="96" fill="#111111">ELHASSANE</text>

  <!-- Pitch -->
  <text x="100" y="440" class="body" font-size="26" fill="#111111">Go and PostgreSQL services that stay correct under</text>
  <text x="100" y="474" class="body" font-size="26" fill="#111111">concurrency and failure, plus React and React Native clients.</text>

  <!-- Stack tags -->
  <g class="mono" font-size="16" fill="#111111">
    <rect x="100" y="506" width="56" height="34" fill="#F7AE85" stroke="#111111" stroke-width="3" />
    <text x="128" y="529" text-anchor="middle">GO</text>
    <rect x="170" y="506" width="140" height="34" fill="#998BBF" stroke="#111111" stroke-width="3" />
    <text x="240" y="529" text-anchor="middle">POSTGRESQL</text>
    <rect x="324" y="506" width="90" height="34" fill="#4D7CFE" stroke="#111111" stroke-width="3" />
    <text x="369" y="529" text-anchor="middle">REACT</text>
    <rect x="428" y="506" width="170" height="34" fill="#2BB673" stroke="#111111" stroke-width="3" />
    <text x="513" y="529" text-anchor="middle">REACT NATIVE</text>
  </g>

  <!-- Accent stack of offset blocks (decorative) -->
  <g stroke="#111111" stroke-width="6" transform="translate(0 -30)">
    <rect x="884" y="190" width="180" height="180" fill="#111111" />
    <rect x="872" y="178" width="180" height="180" fill="#F7AE85" />
    <rect x="932" y="258" width="150" height="150" fill="#111111" />
    <rect x="920" y="246" width="150" height="150" fill="#998BBF" />
    <rect x="852" y="330" width="130" height="130" fill="#111111" />
    <rect x="840" y="318" width="130" height="130" fill="#4D7CFE" />
  </g>
</svg>
